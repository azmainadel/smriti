# One command: `docker compose up`. Add `--profile ollama` to run local LLMs too.
name: smriti

x-api-env: &api-env
  SMRITI_DATABASE_URL: postgresql+asyncpg://smriti:${POSTGRES_PASSWORD:-smriti}@postgres:5432/smriti
  SMRITI_OWNER_SECRET: ${SMRITI_OWNER_SECRET:?set SMRITI_OWNER_SECRET in .env}
  SMRITI_SIGNING_KEY: ${SMRITI_SIGNING_KEY:?set SMRITI_SIGNING_KEY in .env}
  SMRITI_PUBLIC_API_URL: ${SMRITI_PUBLIC_API_URL:-http://localhost:8000}
  SMRITI_CORS_ORIGINS: '["${SMRITI_WEB_URL:-http://localhost:3000}"]'
  # Files live on the `blobs` volume by default. Set these to use any S3-compatible store.
  SMRITI_STORAGE_BACKEND: ${SMRITI_STORAGE_BACKEND:-local}
  SMRITI_STORAGE_DIR: /data/blobs
  SMRITI_S3_ENDPOINT: ${SMRITI_S3_ENDPOINT:-}
  SMRITI_S3_BUCKET: ${SMRITI_S3_BUCKET:-smriti}
  SMRITI_S3_ACCESS_KEY: ${SMRITI_S3_ACCESS_KEY:-}
  SMRITI_S3_SECRET_KEY: ${SMRITI_S3_SECRET_KEY:-}
  SMRITI_LLM_PROVIDER: ${SMRITI_LLM_PROVIDER:-none}
  SMRITI_LLM_MODEL: ${SMRITI_LLM_MODEL:-qwen2.5:3b-instruct}
  SMRITI_CAPTION_MODEL: ${SMRITI_CAPTION_MODEL:-}
  SMRITI_OLLAMA_URL: ${SMRITI_OLLAMA_URL:-http://ollama:11434}
  SMRITI_OPENAI_BASE_URL: ${SMRITI_OPENAI_BASE_URL:-https://api.openai.com/v1}
  SMRITI_OPENAI_API_KEY: ${SMRITI_OPENAI_API_KEY:-}
  SMRITI_EMBED_PROVIDER: ${SMRITI_EMBED_PROVIDER:-fastembed}
  SMRITI_EMBED_MODEL: ${SMRITI_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
  SMRITI_EMBED_DIM: ${SMRITI_EMBED_DIM:-384}
  SMRITI_VISION_ENABLED: ${SMRITI_VISION_ENABLED:-true}
  SMRITI_BROWSER_ENABLED: ${SMRITI_BROWSER_ENABLED:-false}
  SMRITI_INBOUND_EMAIL_SECRET: ${SMRITI_INBOUND_EMAIL_SECRET:-}
  SMRITI_DIGEST_EMAIL_TO: ${SMRITI_DIGEST_EMAIL_TO:-}
  SMRITI_SMTP_HOST: ${SMRITI_SMTP_HOST:-}
  SMRITI_SMTP_USER: ${SMRITI_SMTP_USER:-}
  SMRITI_SMTP_PASSWORD: ${SMRITI_SMTP_PASSWORD:-}
  SMRITI_SMTP_FROM: ${SMRITI_SMTP_FROM:-smriti@localhost}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: smriti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smriti}
      POSTGRES_DB: smriti
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smriti"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./api
      args:
        WITH_BROWSER: ${WITH_BROWSER:-0}
        WITH_WHISPER: ${WITH_WHISPER:-0}
    environment: *api-env
    ports: ["8000:8000"]
    volumes: [models:/models, blobs:/data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: ./api
      args:
        WITH_BROWSER: ${WITH_BROWSER:-0}
        WITH_WHISPER: ${WITH_WHISPER:-0}
    command: ["smriti", "work"]
    environment: *api-env
    volumes: [models:/models, blobs:/data]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${SMRITI_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    profiles: [ollama]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
  models:
  ollama:
